name: Test Package Commands

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
        laravel: ['10.*', '11.*', '12.*']
        include:
          - laravel: '10.*'
            testbench: '^8.22'
          - laravel: '11.*'
            testbench: '^9.0'
          - laravel: '12.*'
            testbench: '^10.0'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, sqlite, gd
          coverage: xdebug

          tools: composer:v2

      - name: Install Dependencies
        run: |
          # 1. Definimos as versões alvo sem atualizar ainda
          composer require "illuminate/support:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          
          # 2. Executamos o update com -W para permitir downgrades de dependências do Pest/PHPUnit
          # Usamos --no-audit para acelerar o processo no CI
          composer update --prefer-stable --no-interaction --no-progress -W

      - name: Run Pest with Coverage Report
        run: |
          # Gera o relatório HTML para o artefato
          vendor/bin/pest --coverage-html build/coverage --compact --ci
          
          # Valida o mínimo de 90% focado apenas no seu comando principal
          vendor/bin/pest --coverage --min=90 --filter=CuidsGenerateCommand
        env:
          XDEBUG_MODE: coverage

      - name: Upload Report Artifact
        if: matrix.php == '8.3' && matrix.laravel == '11.*'
        uses: actions/upload-artifact@v4
        with:
          name: post-coverage-report
          path: build/coverage